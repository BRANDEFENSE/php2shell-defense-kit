# PHP2Shell detection. Access log format for Apache httpd.
# Adds the request Content-Type (ct), Transfer-Encoding (te) and bytes received (reqlen).
# Needs mod_logio for %I. Put this in your server or virtual host config, then reload Apache.
# On RHEL-based systems, use logs/access_log instead of ${APACHE_LOG_DIR}/access.log.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" ct=\"%{Content-Type}i\" te=\"%{Transfer-Encoding}i\" reqlen=%I" php2shell
CustomLog ${APACHE_LOG_DIR}/access.log php2shell
