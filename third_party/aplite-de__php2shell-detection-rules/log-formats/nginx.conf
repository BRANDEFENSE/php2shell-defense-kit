# PHP2Shell detection. Access log format for nginx.
# Adds the request Content-Type (ct), Transfer-Encoding (te) and request size (reqlen).
# Put this in the http block, then test and reload nginx (nginx -t && systemctl reload nginx).
log_format php2shell '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'ct="$content_type" te="$http_transfer_encoding" reqlen=$request_length';
access_log /var/log/nginx/access.log php2shell;
