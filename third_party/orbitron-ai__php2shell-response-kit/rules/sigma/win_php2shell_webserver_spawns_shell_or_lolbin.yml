title: PHP or Web Server Process Spawns Shell or LOLBin on Windows (php2shell post-exploitation)
id: 0c88ffdb-d35f-481e-a5d6-2be5229f289f
status: experimental
description: |
  Detects php-cgi.exe / php.exe (IIS FastCGI, XAMPP, WAMP), Apache httpd.exe or IIS w3wp.exe starting a
  shell, script host, LOLBin or discovery tool. Expected post-exploitation behaviour after
  CVE-2026-109618 / CVE-2026-109619 ("php2shell") or any webshell. Not specific to these CVEs.
  UNTESTED in production SIEMs/EDRs.
references:
  - https://www.huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities
  - https://blog.flatt.tech/entry/php2shell
author: ORBITRON
date: 2026-10-21
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1059.003
  - attack.persistence
  - attack.t1505.003
  - cve.2026-109618
  - cve.2026-109619
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - 'php-cgi.exe'
      - 'php.exe'
      - 'httpd.exe'
      - 'w3wp.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\whoami.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\systeminfo.exe'
      - '\ipconfig.exe'
      - '\nltest.exe'
      - '\tasklist.exe'
      - '\quser.exe'
      - '\curl.exe'
  condition: selection_parent and selection_child
falsepositives:
  - PHP or ASP.NET applications that legitimately shell out (report generators, backup tools, control panels)
level: high
