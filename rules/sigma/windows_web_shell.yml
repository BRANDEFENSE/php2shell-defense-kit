title: Windows Web Runtime Spawning a Command Interpreter
id: 42e004f6-a0a0-519f-acb5-ee2db3f7b805
status: experimental
description: Includes IIS worker processes that may host non-PHP applications; establish
  PHP context independently. This is a hunting lead, not attribution to PHP2Shell
  or proof of successful exploitation.
references:
- https://www.php.net/archive/2026.php#2026-10-21-5
- https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
author: Brandefense Research Team
date: '2026-10-24'
license: MIT
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  parent:
    ParentImage|endswith:
    - \php-cgi.exe
    - \php.exe
    - \httpd.exe
    - \w3wp.exe
  child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
  condition: parent and child
falsepositives:
- Application subprocesses
- Administrative web applications
level: high
