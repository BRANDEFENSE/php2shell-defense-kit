title: Linux Web Runtime Child Referencing Sensitive Credential Paths
id: d07d5d9f-3953-5b87-9508-9b050d3133d9
status: experimental
description: Detects sensitive paths in a direct child command line, not file reads
  performed inside the PHP process. This is a hunting lead, not attribution to PHP2Shell
  or proof of successful exploitation.
references:
- https://www.php.net/archive/2026.php#2026-10-21-5
- https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
author: Brandefense Research Team
date: '2026-10-24'
license: MIT
tags:
- attack.execution
- attack.t1552.001
logsource:
  product: linux
  category: process_creation
detection:
  parent:
    ParentImage|re: (^|/)(php-fpm[0-9.]*|php-cgi[0-9.]*|lsphp[0-9.]*|frankenphp|sw-engine-fpm|apache2|httpd)$
  paths:
    CommandLine|contains:
    - /etc/shadow
    - /.aws/credentials
    - /var/run/secrets/kubernetes.io/
    - /run/secrets/kubernetes.io/
  condition: parent and paths
falsepositives:
- Approved diagnostics and credential integrations
level: high
