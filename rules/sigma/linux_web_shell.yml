title: Linux Web Runtime Spawning a Shell
id: 80072f48-e78a-5af6-beb2-d94fa70ecb0d
status: experimental
description: Detects a web runtime launching a shell. Baseline legitimate maintenance
  and application subprocesses. This is a hunting lead, not attribution to PHP2Shell
  or proof of successful exploitation.
references:
- https://www.php.net/archive/2026.php#2026-10-21-5
- https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
author: Brandefense Research Team
date: '2026-10-24'
license: MIT
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  parent:
    ParentImage|re: (^|/)(php-fpm[0-9.]*|php-cgi[0-9.]*|lsphp[0-9.]*|frankenphp|sw-engine-fpm|apache2|httpd)$
  child:
    Image|endswith:
    - /sh
    - /bash
    - /dash
    - /zsh
    - /ksh
  condition: parent and child
falsepositives:
- Applications that intentionally use a shell
- Deployment and maintenance jobs
level: high
